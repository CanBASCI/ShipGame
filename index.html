<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gece Kanalı</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <aside id="tune">
      <button type="button" id="arcade-toggle" aria-pressed="false">Arcade</button>
      <div class="boat-switch" id="boat-switch">
        <button type="button" data-boat="mevcut" aria-pressed="false">Mevcut</button>
        <button type="button" data-boat="donnichols" aria-pressed="true">Donnichols</button>
      </div>
      <button type="button" id="fog-toggle" aria-pressed="true">Sis</button>
      <div class="tune-with-toggle">
        <div class="tune-row">
          <button type="button" data-tune="bamboo" data-dir="-1" aria-label="Bambu ışığı azalt">−</button>
          <span>Bambu ışığı</span>
          <span class="tune-val" data-val="bamboo">0.3</span>
          <button type="button" data-tune="bamboo" data-dir="1" aria-label="Bambu ışığı artır">+</button>
        </div>
        <button type="button" id="bamboo-toggle" aria-pressed="true" aria-label="Bambu fenerleri">Açık</button>
      </div>
      <div class="tune-row">
        <button type="button" data-tune="water" data-dir="-1" aria-label="Su yansıması azalt">−</button>
        <span>Su yansıması</span>
        <span class="tune-val" data-val="water">0.5</span>
        <button type="button" data-tune="water" data-dir="1" aria-label="Su yansıması artır">+</button>
      </div>
      <div class="tune-row">
        <button type="button" data-tune="ay" data-dir="-1" aria-label="Ay yansıması azalt">−</button>
        <span>Ay yansıması</span>
        <span class="tune-val" data-val="ay">0.5</span>
        <button type="button" data-tune="ay" data-dir="1" aria-label="Ay yansıması artır">+</button>
      </div>
      <div class="tune-row">
        <button type="button" data-tune="tree" data-dir="-1" aria-label="Ağaç azalt">−</button>
        <span>Ağaç</span>
        <span class="tune-val" data-val="tree">1.5</span>
        <button type="button" data-tune="tree" data-dir="1" aria-label="Ağaç artır">+</button>
      </div>
      <div class="tune-row">
        <button type="button" data-tune="fener" data-dir="-1" aria-label="Fener gücü azalt">−</button>
        <span>Fener gücü</span>
        <span class="tune-val" data-val="fener">0.6</span>
        <button type="button" data-tune="fener" data-dir="1" aria-label="Fener gücü artır">+</button>
      </div>
      <div class="tune-row">
        <button type="button" data-tune="spread" data-dir="-1" aria-label="Fener alanı azalt">−</button>
        <span>Fener alanı</span>
        <span class="tune-val" data-val="spread">0.3</span>
        <button type="button" data-tune="spread" data-dir="1" aria-label="Fener alanı artır">+</button>
      </div>
      <label class="tune-day">
        <span>Gece–gündüz <b id="day-val">0.0</b></span>
        <input id="day-slider" type="range" min="0" max="1" step="0.01" value="0" />
      </label>
    </aside>
    <p id="hint">W ileri · A sol · S dur · D sağ</p>
    <div id="arcade-hud" hidden>
      <span><b id="arcade-points">0</b> puan</span>
      <span><b id="arcade-lives">0</b> can</span>
      <span class="hud-orange"><b id="arcade-orange">0</b></span>
      <span class="hud-cyan"><b id="arcade-cyan">0</b></span>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
